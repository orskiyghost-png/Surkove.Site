<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>SURKOVE — проверка сайта</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101820;
      color: #f4f7f8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(65, 211, 161, .12), transparent 55%),
        #101820;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 24px;
      background: rgba(255, 255, 255, .04);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }

    .brand {
      margin: 0 0 40px;
      color: #9aabb4;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .18em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(65, 211, 161, .28);
      border-radius: 999px;
      background: rgba(65, 211, 161, .08);
      color: #71e5b9;
      font-size: .85rem;
      font-weight: 650;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #41d3a1;
      box-shadow: 0 0 12px rgba(65, 211, 161, .7);
    }

    h1 {
      margin: 22px 0 12px;
      font-size: clamp(2.2rem, 8vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .description {
      max-width: 42ch;
      margin: 0;
      color: #aab8bf;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    .details {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      color: #81919a;
      font-size: .875rem;
    }

    #loaded-at { color: #c2cdd2; }
  </style>
</head>
<body>
  <main>
    <p class="brand">SURKOVE / SITE CHECK</p>
    <span class="status"><span class="dot" aria-hidden="true"></span>Страница загружена</span>
    <h1>Сайт работает</h1>
    <p class="description">Тестовая страница успешно открылась. HTML, стили и JavaScript загружены.</p>
    <div class="details">Время проверки: <time id="loaded-at">—</time></div>
  </main>
  <script>
    document.getElementById("loaded-at").textContent = new Intl.DateTimeFormat("ru-RU", {
      dateStyle: "medium",
      timeStyle: "medium"
    }).format(new Date());
  </script>
</body>
</html>
