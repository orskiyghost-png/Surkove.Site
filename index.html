<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>SURKOVE — проверка сайта</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f7f7f5;
      --text: #171717;
      --muted: #737373;
      --accent: #2563eb;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(28px, 7vw, 64px) 22px;
      background: var(--page-bg);
    }

    main {
      width: min(100%, 920px);
      margin: auto;
    }

    .brand {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .16em;
    }

    .status {
      width: fit-content;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      border: 1px solid rgba(37, 99, 235, .18);
      border-radius: 999px;
      background: rgba(37, 99, 235, .055);
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 600;
    }

    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
    }

    h1 {
      max-width: 850px;
      margin: 22px 0 0;
      font-size: clamp(44px, 8vw, 88px);
      line-height: .99;
      letter-spacing: -.065em;
      font-weight: 650;
    }

    .description {
      max-width: 620px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.65;
      letter-spacing: -.015em;
    }

    .details {
      margin-top: 38px;
      padding-top: 19px;
      border-top: 1px solid rgba(23, 23, 23, .12);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    #loaded-at { color: var(--text); }

    .has-motion [data-blur-reveal] .blur-word {
      display: inline-block;
      opacity: 0;
      filter: blur(12px);
      transform: translate3d(0, 13px, 0);
      transition:
        opacity .72s var(--ease-out),
        filter .72s var(--ease-out),
        transform .72s var(--ease-out);
      transition-delay: calc(var(--word-index, 0) * .02s);
      will-change: opacity, filter, transform;
    }

    .has-motion [data-blur-reveal].is-visible .blur-word {
      opacity: 1;
      filter: blur(0);
      transform: translate3d(0, 0, 0);
    }

    .has-motion [data-reveal] {
      opacity: 0;
      filter: blur(8px);
      transform: translate3d(0, 8px, 0);
      transition:
        opacity .65s var(--ease-out),
        filter .65s var(--ease-out),
        transform .65s var(--ease-out);
    }

    .has-motion [data-reveal].is-visible {
      opacity: 1;
      filter: blur(0);
      transform: translate3d(0, 0, 0);
    }

    @media (max-width: 600px) {
      .brand { margin-bottom: 26px; }
      h1 { font-size: clamp(43px, 12vw, 64px); }
      .description { margin-top: 21px; }
      .details { margin-top: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="brand" data-blur-reveal>SURKOVE / SITE CHECK</p>
    <span class="status" data-reveal><span class="dot" aria-hidden="true"></span>Страница загружена</span>
    <h1 data-blur-reveal>Сайт работает</h1>
    <p class="description" data-blur-reveal>Тестовая страница успешно открылась. HTML, стили и JavaScript загружены.</p>
    <div class="details" data-reveal>Время проверки: <time id="loaded-at">—</time></div>
  </main>
  <script>
    document.getElementById("loaded-at").textContent = new Intl.DateTimeFormat("ru-RU", {
      dateStyle: "medium",
      timeStyle: "medium"
    }).format(new Date());
  </script>
  <script>
    (() => {
      const wordTargets = document.querySelectorAll("[data-blur-reveal]");
      const revealTargets = document.querySelectorAll("[data-reveal]");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduceMotion || !("IntersectionObserver" in window)) return;

      document.documentElement.classList.add("has-motion");

      wordTargets.forEach((element) => {
        const originalText = element.textContent.replace(/\s+/g, " ").trim();
        const words = originalText.split(" ");
        const fragment = document.createDocumentFragment();

        element.setAttribute("aria-label", originalText);

        words.forEach((word, index) => {
          const span = document.createElement("span");
          span.className = "blur-word";
          span.setAttribute("aria-hidden", "true");
          span.style.setProperty("--word-index", index);
          span.textContent = word;
          fragment.appendChild(span);

          if (index < words.length - 1) {
            fragment.appendChild(document.createTextNode(" "));
          }
        });

        element.textContent = "";
        element.appendChild(fragment);
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          entry.target.classList.toggle("is-visible", entry.isIntersecting);
        });
      }, {
        threshold: 0.18,
        rootMargin: "0px 0px -4% 0px"
      });

      [...wordTargets, ...revealTargets].forEach((element) => observer.observe(element));
    })();
  </script>
</body>
</html>
