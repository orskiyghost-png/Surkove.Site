name: Diagnose SURKOVE hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test Majordomo FTP and website HTTPS
        run: |
          python3 - <<'PY'
          import socket
          import sys

          checks = [
              ("Majordomo FTP control", "185.84.108.232", 21),
              ("SURKOVE HTTPS", "surkove.ru", 443),
              ("SURKOVE HTTP", "surkove.ru", 80),
          ]

          results = {}
          for label, host, port in checks:
              print(f"\n--- {label}: {host}:{port} ---", flush=True)
              try:
                  addresses = sorted({item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)})
                  print("DNS:", ", ".join(addresses), flush=True)
                  with socket.create_connection((host, port), timeout=15):
                      print("TCP: CONNECTED", flush=True)
                      results[label] = True
              except Exception as exc:
                  print(f"TCP: FAILED ({type(exc).__name__}: {exc})", flush=True)
                  results[label] = False

          print("\n--- RESULT ---")
          for label, ok in results.items():
              print(f"{label}: {'OPEN' if ok else 'UNREACHABLE'}")

          if not results.get("SURKOVE HTTPS", False):
              print("\nHTTPS is not reachable from this GitHub runner. HTTPS-based deployment cannot be used until this is resolved.")
          elif not results.get("Majordomo FTP control", False):
              print("\nHTTPS works but FTP does not. We can switch to a protected HTTPS deployment endpoint and avoid inbound FTP/SSH.")
          else:
              print("\nFTP control port is reachable. The next test should inspect FTP login/passive data connection.")
          PY

      - name: Check HTTPS response (HTTP status is diagnostic only)
        run: |
          curl --verbose --location --max-time 25 --output /dev/null \
            --write-out '\nHTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\n' \
            https://surkove.ru/ || true