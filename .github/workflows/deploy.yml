name: Deploy SURKOVE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Diagnose and deploy to Majordomo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Check FTP and SSH ports
        id: ports
        env:
          FTP_HOST: 185.84.108.232
        run: |
          python3 - <<'PY'
          import os
          import socket

          host = os.environ["FTP_HOST"]
          results = {}

          for name, port in (("ftp", 21), ("ssh", 22)):
              try:
                  with socket.create_connection((host, port), timeout=12):
                      print(f"{name.upper()} port {port}: OPEN — TCP connection successful")
                      results[name] = "true"
              except OSError as error:
                  print(f"{name.upper()} port {port}: UNREACHABLE — {type(error).__name__}: {error}")
                  results[name] = "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in results.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Explain SSH fallback
        if: steps.ports.outputs.ftp != 'true' && steps.ports.outputs.ssh == 'true'
        run: |
          echo "FTP port 21 is unreachable from GitHub Actions, but SSH port 22 is reachable."
          echo "Deployment should be switched to SSH/SFTP after configuring an SSH key in Majordomo."

      - name: Stop if neither FTP nor SSH is reachable
        if: steps.ports.outputs.ftp != 'true' && steps.ports.outputs.ssh != 'true'
        run: |
          echo "::error::Both FTP (21) and SSH (22) are unreachable from GitHub Actions. This is a network/server access issue, not an FTP password or folder-path issue."
          exit 1

      - name: Upload website via FTP (connection test)
        if: steps.ports.outputs.ftp == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          security: loose
          timeout: 180000
          log-level: verbose
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          local-dir: ./
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            README.md
